name: Deploy to cPanel

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Trigger cPanel Auto Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Instant Sync Deploy
        run: |
          echo "Memulai pemicu deployment instan..."
          DEPLOY_URL="https://www.parokitulungagung.org/cpanel-deploy.php?token=paroki_deploy_secure_908430316"
          
          # Kirim request ke deployment PHP script secara synchronous
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" "$DEPLOY_URL")
          HTTP_CODE=$(echo "$RESPONSE" | tr -d '\r' | tail -n 1 | cut -d':' -f2)
          BODY=$(echo "$RESPONSE" | head -n -1)
          
          echo "HTTP Status Code: $HTTP_CODE"
          echo "Response Body: $BODY"
          
          if [ "$HTTP_CODE" -eq 200 ] && echo "$BODY" | grep -q '"status":"success"'; then
            echo "Sukses: Deployment sinkron selesai seketika (Instant Deploy Berhasil)!"
            exit 0
          else
            echo "Peringatan: Deploy instan gagal atau dibatasi. Mencoba fallback ke cPanel UAPI..."
          fi

      - name: Fallback to cPanel UAPI Queue Deploy
        if: always() # Jalankan jika langkah instan di atas gagal atau dilewati
        run: |
          BASE_URL="${{ secrets.CPANEL_URL }}"
          BASE_URL="${BASE_URL%/}"
          USER="${{ secrets.CPANEL_USER }}"
          TOKEN="${{ secrets.CPANEL_TOKEN }}"
          REPO="/home/ejtkecoh/repositories/parokitulungagung"

          echo "Mengirim trigger Update Git ke cPanel..."
          UPDATE_RES=$(curl -s -k -X POST \
            -H "Authorization: cpanel ${USER}:${TOKEN}" \
            "${BASE_URL}/execute/VersionControl/update" \
            -d "repository_root=${REPO}")
          echo "Respon Update: ${UPDATE_RES}"

          echo "Mengirim trigger Deployment ke cPanel..."
          DEPLOY_RES=$(curl -s -k -X POST \
            -H "Authorization: cpanel ${USER}:${TOKEN}" \
            "${BASE_URL}/execute/VersionControlDeployment/create" \
            -d "repository_root=${REPO}")
          echo "Respon Deploy: ${DEPLOY_RES}"

          if echo "${DEPLOY_RES}" | grep -qE '"status":[ ]*1'; then
            echo "Deployment cPanel berhasil diantrekan!"
          else
            echo "Error: Gagal memicu deployment fallback cPanel."
            exit 1
          fi
