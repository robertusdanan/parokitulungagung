---
deployment:
  tasks:
    - export DEPLOYPATH=/home/ejtkecoh/public_html
    - /bin/cp -a . $DEPLOYPATH/
    - /bin/rm -rf $DEPLOYPATH/.git $DEPLOYPATH/.gitignore $DEPLOYPATH/.cpanel.yml
    - /bin/find $DEPLOYPATH -type d -exec /bin/chmod 755 {} +
    - /bin/find $DEPLOYPATH -type f -exec /bin/chmod 644 {} +
